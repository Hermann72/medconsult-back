spring-application:
  name: medconsult-back

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medconsult
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    server:
      port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO




