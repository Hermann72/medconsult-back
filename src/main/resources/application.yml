spring-application:
  name: medconsult-back

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medconsult
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    server:
      port: 8080

# Logging configuration
logging:
  level:
    root: INFO
    com.hero.medconsult-back: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

